plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vocabularyquest.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.vocabularyquest.app'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '4.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
